# One-click deploy on Render (free plan). Keys are asked for during setup and
# stored only in Render's environment settings, never in this repo.
services:
  - type: web
    name: zain-agent-daftar
    runtime: node
    plan: free
    branch: claude/project-thread-e27k2s
    buildCommand: echo "no dependencies"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
